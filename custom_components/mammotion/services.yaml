raw_pymammotion_step_response_probe:
  description: >-
    Open-loop dead-time measurement. Drives a fixed baseline -> step -> settle
    command sequence (angular 0, then a measured angular, then angular 0 again)
    without stopping in between, and records position at the in-window cadence.
    There is NO controller: no route, no aim point, no steering law. It answers
    whether the control lag is in the actuator or the observer, and how large it
    is (docs/phase2-dead-time-step-test-design-20260828.md). corridor_polygon
    must be pre-scanned and margin-verified offline and must clear
    max_travel_m plus 0.50 m of stopping overshoot in EVERY direction, because
    the path curves and its shape is the unknown under test. dry_run defaults
    true and sends nothing; a real run additionally requires
    confirm_step_response_run.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: mammotion
    route_start:
      required: true
      example:
        x: 5.98
        y: -5.24
      selector:
        object:
    corridor_polygon:
      required: true
      example:
        - x: 2.98
          y: -8.24
        - x: 8.98
          y: -8.24
        - x: 8.98
          y: -2.24
        - x: 2.98
          y: -2.24
      selector:
        object:
    linear_speed:
      name: Linear speed
      description: >-
        400 or 300. 300 became admissible with rule E-VIO, which reads VIO
        heading between consecutive distinct readings and imposes no travel
        floor -- unlike the old RTK course statistic, which needed a 0.15 m
        chord and ruled 300 out. Driving slower is what lets a long step phase
        fit inside max_travel_m and the corridor.
        400 sustains ~0.216 m/s (mean of five banked full-window runs, range
        0.194-0.262). 300 is ESTIMATED at ~0.16 m/s and has never been measured
        sustained -- it is one 4 s ramp-inclusive sample (0.116 m/s) scaled by
        the 1.37x sustained/average ratio observed at 400. Treat any 300 figure
        as an estimate, not a measurement. The command/speed relation is NOT
        linear: a 25% command cut gave a 39% speed cut.
      required: false
      default: "400"
      example: "400"
      selector:
        select:
          options:
            - "300"
            - "400"
    step_angular_speed:
      required: false
      default: "120"
      example: "120"
      selector:
        select:
          options:
            - "-180"
            - "-120"
            - "120"
            - "180"
    baseline_ms:
      required: false
      default: 3000
      example: 3000
      selector:
        number:
          min: 1000
          max: 5000
          step: 100
    step_ms:
      name: Step duration
      description: >-
        Up to 15000 ms. Criterion 2a splits the step phase in half and compares
        mean rates, so the one interval straddling the command onset carries
        ~1/k of the first half's weight; a longer step shrinks that share. This
        raises the CLOCK only -- max_travel_m is unchanged, and a step_ms that
        cannot fit it at the chosen linear_speed is refused before dispatch with
        step_window_travel_exceeds_budget.
        ⚠️ baseline_ms + step_ms + settle_ms must also total 23000 ms or less, or
        the run is refused with step_window_too_long. The three selectors each
        permit their own maximum, so 5000 + 15000 + 6000 validates per-field and
        is still refused on the sum.
      required: false
      default: 3000
      example: 3000
      selector:
        number:
          min: 1000
          max: 15000
          step: 100
    settle_ms:
      required: false
      default: 4000
      example: 4000
      selector:
        number:
          min: 1000
          max: 6000
          step: 100
    motion_refresh_interval_ms:
      required: false
      default: 200
      example: 200
      selector:
        number:
          min: 50
          max: 1000
          step: 50
    sample_interval_ms:
      required: false
      default: 100
      example: 100
      selector:
        number:
          min: 50
          max: 1000
          step: 50
    max_travel_m:
      required: false
      default: 2.50
      example: 2.50
      selector:
        number:
          min: 0.10
          max: 4.5
          step: 0.05
          unit_of_measurement: m
    prefer_ble:
      required: false
      default: true
      example: true
      selector:
        boolean:
    dry_run:
      required: false
      default: true
      example: true
      selector:
        boolean:
    confirm_blades_off:
      required: false
      default: false
      example: false
      selector:
        boolean:
    confirm_clear_area:
      required: false
      default: false
      example: false
      selector:
        boolean:
    confirm_step_response_run:
      required: false
      default: false
      example: false
      selector:
        boolean:

continuous_motion_window:
  description: >-
    Dry-runs Phase 2 steering geometry. Real execution is currently blocked
    with steering_not_motion_validated. Heading uses only fresh position chords
    of at least 0.15 m; toward is diagnostic only. corridor_polygon must
    be pre-scanned, margin-verified offline, and provide at least 1.34 m of
    boundary clearance around the live start
    (scripts/freeze_phase1_corridors.py, scripts/scan_contained_bearings.py).
    This service never scans or freezes one itself. dry_run defaults true and
    sends nothing. Experimental v1 is fixed at linear 400 / angular bound 180.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: mammotion
    route_start:
      required: true
      example:
        x: 0.0
        y: 0.0
      selector:
        object:
    route_target:
      required: true
      example:
        x: 1.0
        y: 0.0
      selector:
        object:
    corridor_polygon:
      required: true
      example:
        - x: -1.1
          y: -1.1
        - x: 2.1
          y: -1.1
        - x: 2.1
          y: 1.1
        - x: -1.1
          y: 1.1
      selector:
        object:
    linear_speed:
      required: false
      default: 400
      selector:
        number:
          min: 400
          max: 400
          step: 1
    max_abs_angular_speed:
      required: false
      default: 180
      # step 60 over 120..180 offers exactly {120, 180}, matching the schema's
      # vol.In([120, 180]). Both are MEASURED arc values; the turn rate is
      # measured only across 120-180 and must not be scaled outside that band,
      # so a smaller value would be unmeasured rather than safer.
      selector:
        number:
          min: 120
          max: 180
          step: 60
    duration_ms:
      required: false
      default: 4000
      selector:
        number:
          min: 1000
          max: 8000
          step: 100
    motion_refresh_interval_ms:
      required: false
      default: 200
      selector:
        number:
          min: 50
          max: 1000
          step: 50
    decision_sample_interval_ms:
      required: false
      default: 100
      selector:
        number:
          min: 50
          max: 1000
          step: 50
    max_distance_m:
      required: false
      default: 1.50
      selector:
        number:
          min: 0.10
          max: 3.0
          step: 0.05
          unit_of_measurement: m
    max_cross_track_m:
      required: false
      default: 0.30
      selector:
        number:
          min: 0.05
          max: 0.30
          step: 0.05
          unit_of_measurement: m
    prefer_ble:
      required: false
      default: true
      selector:
        boolean:
    dry_run:
      required: false
      default: true
      selector:
        boolean:
    confirm_blades_off:
      required: false
      default: false
      selector:
        boolean:
    confirm_clear_area:
      required: false
      default: false
      selector:
        boolean:
    confirm_steering_validation_run:
      required: false
      default: false
      selector:
        boolean:

heading_acquisition_window:
  description: >-
    Runs or simulates a bounded straight-only heading acquisition. It subscribes
    to position-specific evidence before requesting reports, drives only at the
    measured linear 400 command with angular speed fixed at zero, and stops on
    the first qualifying 0.15 m chord or any two-second, one-metre, corridor,
    position-sequence, transport-epoch, telemetry-age, refresh, or BLE fault.
    The supplied corridor must contain the complete 1.34 m blind-acquisition
    disk around the live origin. No heading token is persisted and steering is
    never enabled.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: mammotion
    route_start:
      required: true
      example:
        x: 0.0
        y: 0.0
      selector:
        object:
    route_target:
