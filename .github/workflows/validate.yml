name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Install HA component requirements
        # `pip install homeassistant` ships CORE only — the per-component
        # requirements are not installed. Importing this integration pulls in
        # everything listed in its manifest `dependencies`, transitively, and
        # each of those components has requirements of its own; without them
        # every test module dies at collection on ModuleNotFoundError.
        #
        # Derived from the installed HA manifests rather than hand-pinned,
        # because a hand-pinned list is precisely what rotted this workflow
        # before: it silently drifts from whatever HA version is installed.
        run: |
          python - <<'PY' > /tmp/component-requirements.txt
          import importlib.util, json, pathlib
          root = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent / "components"
          manifest = json.loads(pathlib.Path("custom_components/mammotion/manifest.json").read_text())
          seen: set[str] = set()
          reqs: set[str] = set()
          stack = list(manifest.get("dependencies", []))
          while stack:
              name = stack.pop()
              if name in seen:
                  continue
              seen.add(name)
              path = root / name / "manifest.json"
              if not path.exists():
                  continue
              data = json.loads(path.read_text())
              reqs.update(data.get("requirements", []))
              stack.extend(data.get("dependencies", []))
              stack.extend(data.get("after_dependencies", []))
          print("\n".join(sorted(reqs)))
          PY
          echo "--- resolved from HA component manifests ---"
          cat /tmp/component-requirements.txt
          python -m pip install -r /tmp/component-requirements.txt
      - name: Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Mypy
        run: mypy --follow-imports=skip custom_components/mammotion
      - name: Tests
        run: pytest --cov=custom_components.mammotion --cov-report=term-missing tests
      - name: Frontend card tests
        run: npm run test:frontend
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/mammotion").rglob("*.json"):
              json.loads(path.read_text())
          PY

  hacs:
    # HACS validates whether a REPOSITORY is publishable as an integration --
    # topics, issue tracker, license. Those are properties of the publishing
    # repo, not of a fork used to stage development, and on a fork they fail for
    # reasons no code change can fix: a fork of an unlicensed upstream cannot
    # add a license (that is not ours to grant), and upstream itself currently
    # carries neither a license nor topics, so this job is red there too.
    # Running it on every fork PR turns a publishing-readiness check into
    # permanent noise that masks the checks that do carry signal.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
