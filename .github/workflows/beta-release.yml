name: Beta Release

on:
  workflow_dispatch:
    inputs:
      confirmed_luba_acceptance:
        description: "I confirm CI and supervised LUBA acceptance passed"
        required: true
        type: boolean

jobs:
  check-tag:
    name: Check if commit is already tagged
    runs-on: ubuntu-latest
    outputs:
      is_tagged: ${{ steps.check.outputs.is_tagged }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for existing tag
        id: check
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo "Commit already has a tag — skipping beta release"
            echo "is_tagged=true" >> $GITHUB_OUTPUT
          else
            echo "is_tagged=false" >> $GITHUB_OUTPUT
          fi

  beta-release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    if: "inputs.confirmed_luba_acceptance && needs.check-tag.outputs.is_tagged != 'true'"
    needs: check-tag
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Determine beta version
        id: version
        run: |
          git fetch --force --tags origin

          # Get current base version from manifest.json, stripping any existing beta suffix
          BASE_VERSION=$(jq -r .version custom_components/mammotion/manifest.json | sed 's/-beta[0-9]*$//')

          # Start above both the manifest suffix and every fetched remote tag.
          # NOTE: single backslashes. A YAML block scalar does not process
          # escapes, so `\\(` reaches sed as an escaped backslash plus a literal
          # `(` and the capture group never matches. That made both variables
          # empty, so HIGHEST fell to 0 and this step always proposed beta1 --
          # which is why `Beta Release` could not run at all, and why the
          # version has regressed in the past.
          MANIFEST_BETA=$(jq -r .version custom_components/mammotion/manifest.json \
            | sed -n 's/.*-beta\([0-9][0-9]*\)$/\1/p')
          TAG_BETA=$(git tag --list "v${BASE_VERSION}-beta*" \
            | sed -n 's/.*-beta\([0-9][0-9]*\)$/\1/p' \
            | sort -n | tail -1)
          HIGHEST=${MANIFEST_BETA:-0}
          if [ "${TAG_BETA:-0}" -gt "$HIGHEST" ]; then
            HIGHEST=$TAG_BETA
          fi
          BETA_NUM=$((HIGHEST + 1))

          BETA_VERSION="${BASE_VERSION}-beta${BETA_NUM}"
          if git rev-parse "v${BETA_VERSION}" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag v${BETA_VERSION}"
            exit 1
          fi
          echo "beta_version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "Next beta version: ${BETA_VERSION}"

      - name: Update manifest.json
        run: |
          jq --arg version "${{ steps.version.outputs.beta_version }}" \
            '.version = $version' custom_components/mammotion/manifest.json \
            > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/mammotion/manifest.json

      - name: Update pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.beta_version }}"/' pyproject.toml

      - name: Update card resource version
        run: |
          sed -i 's/^const CARD_VERSION = ".*";/const CARD_VERSION = "${{ steps.version.outputs.beta_version }}";/' \
            custom_components/mammotion/www/mammotion-custom-path-card.js

      - name: Update uv.lock
        run: uv lock

      - name: Verify release versions agree
        run: |
          EXPECTED="${{ steps.version.outputs.beta_version }}"
          test "$(jq -r .version custom_components/mammotion/manifest.json)" = "$EXPECTED"
          # Single backslashes, for the same block-scalar reason as above: the
          # doubled form extracted nothing, so this compared "" against the
          # expected version and could never pass.
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" = "$EXPECTED"
          grep -Fq "const CARD_VERSION = \"${EXPECTED}\";" \
            custom_components/mammotion/www/mammotion-custom-path-card.js
          # The project is `mammotion-ha`, not `mammotion`, and uv writes the
          # PEP 440 normalised form (0.6.4-beta12 -> 0.6.4b12). Matching the
          # dashed form against a package name that is not in the lock file
          # meant this line grepped empty input for a string uv never writes.
          LOCK_VERSION="${EXPECTED/-beta/b}"
          grep -A4 'name = "mammotion-ha"' uv.lock \
            | grep -Fq "version = \"${LOCK_VERSION}\""

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/mammotion/manifest.json \
            custom_components/mammotion/www/mammotion-custom-path-card.js \
            pyproject.toml uv.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.beta_version }} [skip ci]"
          git push

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Derive execution-profile acceptance
        id: profile
        run: |
          # The `confirmed_luba_acceptance` input cannot answer this. It gates
          # this job with an `if:`, so it is true by construction whenever we
          # get here -- echoing it would print "true" on every release. Derive
          # the answer from the code instead.
          {
            echo 'markdown<<PROFILE_EOF'
            python3 scripts/check_accepted_profile.py --markdown
            echo 'PROFILE_EOF'
          } >> "$GITHUB_OUTPUT"
          python3 scripts/check_accepted_profile.py

      - name: Get previous release tag
        id: previous_tag
        run: |
          previous=$(git tag --sort=-v:refname | grep -v "beta" | head -1)
          if [ -z "$previous" ]; then
            previous=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "previous_tag=${previous}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo 'changelog<<EOF'
            git log --pretty=format:"- %h - %an: %s" \
              "${{ steps.previous_tag.outputs.previous_tag }}".."${{ steps.version.outputs.tag }}" \
              | grep -v "\[skip ci\]" || echo "- No user-facing changes"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: comnoco/create-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Beta Release ${{ steps.version.outputs.tag }}
          body: |
            # Mammotion - Home Assistant Integration ${{ steps.version.outputs.tag }} (Beta)

            [![Discord](https://img.shields.io/discord/1247286396297678879)](https://discord.gg/vpZdWhJX8x)

            > ⚠️ **This is a beta release.** To install via HACS, enable "Show beta versions" in your HACS settings.

            ${{ steps.profile.outputs.markdown }}

            ## Changes since last stable release

            ${{ steps.changelog.outputs.changelog }}

            ## Installation via HACS

            1. In HACS, go to **Settings** and enable **"Show beta versions"**.
            2. Find the Mammotion integration and install the beta version.
            3. Restart Home Assistant.

            ## Feedback and Support

            If you encounter any issues, please:
            - [Open an issue](https://github.com/${{ github.repository }}/issues) on GitHub
            - [Join our Discord](https://discord.gg/vpZdWhJX8x) for community support

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.previous_tag.outputs.previous_tag }}...${{ steps.version.outputs.tag }}
          draft: false
          prerelease: true
